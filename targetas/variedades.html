<script type="text/template" id="variedades-genetica">
        <header>
            <h1>El éxito de su plantación de café comienza con la selección de la variedad adecuada</h1>
            <p>El éxito de su plantación de café comienza con la selección de la variedad adecuada para sus condiciones de cultivo específicas. Dado que el cambio climático afecta a las regiones cafetaleras tradicionales, comprender las capacidades de adaptación de las diferentes variedades de café nunca ha sido más importante.</p>
        </header>

        <section>
            <h2>La importancia de la selección de variedades</h2>
            <p>Las plantas de café destacan por su diversidad genética, y cada variedad ofrece características únicas en términos de:</p>
            <ul>
                <li>Adaptación climática</li>
                <li>Resistencia a enfermedades</li>
                <li>Potencial de rendimiento</li>
                <li>Calidad de la taza</li>
                <li>Tiempo de maduración</li>
            </ul>
            <p>Seleccionar una variedad que se adapte a sus condiciones locales es la decisión más importante que tomará como productor de café. Ninguna gestión cuidadosa puede superar las limitaciones de una variedad mal adaptada.</p>
        </section>

        <section>
            <h2>Comprender sus parámetros climáticos</h2>
            <p>Antes de seleccionar una variedad de café, evalúe estos factores climáticos clave:</p>
            <ul>
                <li>Rango de temperatura: Temperaturas mínimas/máximas diarias y estacionales</li>
                <li>Patrón de precipitaciones: Precipitación anual y distribución durante todo el año</li>
                <li>Altitud: La elevación afecta la temperatura, la intensidad de la luz solar y la humedad</li>
                <li>Niveles de humedad: Afecta la presión de las enfermedades y el desarrollo del frijol</li>
                <li>Exposición al viento: Puede dañar las plantas y aumentar el estrés hídrico</li>
            </ul>
            <p>Documente estos parámetros durante al menos un año completo antes de tomar decisiones de plantación. Muchas regiones tienen variaciones microclimáticas que no se capturan en los datos climáticos generales.</p>
        </section>

        <section>
            <h2>Variedades arábicas y sus preferencias climáticas</h2>
            <p>Coffea arabica representa aproximadamente el 60% de la producción mundial de café y es conocida por su calidad de taza superior. Las variedades clave de arábica incluyen:</p>

            <h3>Típica</h3>
            <ul>
                <li>Altitud óptima: 1.200-1.800 metros</li>
                <li>Rango de temperatura: 15-24°C (59-75°F)</li>
                <li>Requisitos de precipitaciones: 1.500-2.000 mm al año, bien distribuido</li>
                <li>Más adecuado para: Zonas con humedad moderada y mínima presión de enfermedad</li>
            </ul>

            <h3>Borbón</h3>
            <ul>
                <li>Altitud óptima: 1.100-2.000 metros</li>
                <li>Rango de temperatura: 17-25°C (63-77°F)</li>
                <li>Requisitos de precipitaciones: 1.200-1.800 mm al año</li>
                <li>Más adecuado para: Regiones con distintas estaciones secas y presión moderada de enfermedades</li>
            </ul>

            <h3>Caturra</h3>
            <ul>
                <li>Altitud óptima: 900-1.700 metros</li>
                <li>Rango de temperatura: 19-28°C (66-82°F)</li>
                <li>Requisitos de precipitaciones: 1.000-1.800 mm al año</li>
                <li>Más adecuado para: Regiones de menor altitud con buena fertilidad del suelo</li>
            </ul>

            <h3>Gesha/Geisha</h3>
            <ul>
                <li>Altitud óptima: 1.400-2.000 metros</li>
                <li>Rango de temperatura: 17-22°C (63-72°F)</li>
                <li>Requisitos de precipitaciones: 1.600-2.500 mm al año</li>
                <li>Más adecuado para: Regiones de gran altitud con temperaturas suaves y precipitaciones adecuadas</li>
            </ul>

            <h3>Catimor</h3>
            <ul>
                <li>Altitud óptima: 600-1.500 metros</li>
                <li>Rango de temperatura: 20-30°C (68-86°F)</li>
                <li>Requisitos de precipitaciones: 1.000-2.000 mm al año</li>
                <li>Más adecuado para: Regiones de menor altitud con alta presión de enfermedades</li>
            </ul>
        </section>

        <section>
            <h2>Variedades Robusta para condiciones desafiantes</h2>
            <p>Coffea canephora (Robusta) representa alrededor del 40% de la producción mundial de café y ofrece mayor resiliencia climática y resistencia a las enfermedades que Arábica.</p>

            <h3>Conilons</h3>
            <ul>
                <li>Altitud óptima: 0-800 metros</li>
                <li>Rango de temperatura: 22-30°C (72-86°F)</li>
                <li>Requisitos de precipitaciones: 1.200-2.500 mm al año</li>
                <li>Más adecuado para: Regiones bajas cálidas y húmedas</li>
            </ul>

            <h3>Robustas mejoradas</h3>
            <ul>
                <li>Altitud óptima: 300-1.000 metros</li>
                <li>Rango de temperatura: 20-30°C (68-86°F)</li>
                <li>Requisitos de precipitaciones: 1.500-3.000 mm al año</li>
                <li>Más adecuado para: Regiones demasiado cálidas para una producción arábica de calidad</li>
            </ul>
        </section>

        <section>
            <h2>Variedades híbridas para la resiliencia climática</h2>
            <p>Los programas de mejoramiento modernos han creado híbridos que combinan la calidad de copa de Arábica con la resistencia de Robusta.</p>

            <h3>Arabusta</h3>
            <ul>
                <li>Altitud óptima: 800-1.200 metros</li>
                <li>Rango de temperatura: 20-28°C (68-82°F)</li>
                <li>Requisitos de precipitaciones: 1.500-2.500 mm al año</li>
                <li>Más adecuado para: Zonas de transición entre las regiones tradicionales de Arábica y Robusta</li>
            </ul>

            <h3>Híbridos de F1</h3>
            <ul>
                <li>Altitud óptima: Variable, normalmente entre 900 y 1.500 metros</li>
                <li>Rango de temperatura: 18-26°C (64-79°F)</li>
                <li>Requisitos de precipitaciones: 1.200-2.200 mm al año</li>
                <li>Más adecuado para: Regiones que experimentan impactos del cambio climático</li>
            </ul>
        </section>

        <section>
            <h2>Consideraciones sobre la resistencia a las enfermedades</h2>
            <p>Diferentes regiones enfrentan diferentes presiones de enfermedades, lo que debería influir en la selección de variedades:</p>
            <ul>
                <li>Óxido de hojas de café (Roya): Gran preocupación en zonas cálidas y húmedas. Catimor, Sarchimor y los híbridos modernos de F1 ofrecen resistencia.</li>
                <li>Enfermedad de las bayas de café: Más grave en regiones frescas y de gran altitud con altas precipitaciones. Las variedades resistentes incluyen Ruiru 11 y Batian.</li>
                <li>Nematodos: Problemático en muchas regiones. Los portainjertos de Robusta ofrecen cierta resistencia.</li>
            </ul>
        </section>

        <section>
            <h2>Ensayos locales y adaptación</h2>
            <p>Antes de plantar a gran escala, realice pequeños ensayos con múltiples variedades para evaluar la adaptación local:</p>
            <ul>
                <li>Plantar parcelas de prueba de 20 a 50 árboles de cada variedad candidata</li>
                <li>Supervisar el rendimiento durante al menos 2-3 años productivos</li>
                <li>Evaluar el vigor del crecimiento, la resistencia a las enfermedades, el rendimiento y la calidad de la copa</li>
                <li>Seleccione las 2 o 3 variedades con mejor rendimiento para plantaciones a mayor escala</li>
            </ul>
            <p>La diversidad en la plantación proporciona un seguro contra las condiciones cambiantes y las amenazas emergentes.</p>
        </section>

        <section>
            <h2>Adaptaciones al cambio climático</h2>
            <p>A medida que cambian las condiciones climáticas, considere estas estrategias de adaptación:</p>
            <ul>
                <li>Seleccione variedades con rangos de tolerancia a la temperatura más amplios</li>
                <li>Considere variedades desarrolladas para condiciones ligeramente más cálidas que su clima actual</li>
                <li>Implementar sistemas agroforestales para modificar el microclima</li>
                <li>Instalar sistemas de riego para mitigar la variabilidad de las precipitaciones</li>
            </ul>
        </section>
            <h2>Conclusión</h2>
            <p>Seleccionar la variedad de café adecuada es un primer paso crucial hacia una plantación de café productiva, resiliente y de alta calidad. Al adaptar cuidadosamente las variedades a sus condiciones climáticas específicas, puede establecer una base para el éxito a largo plazo incluso cuando las condiciones de crecimiento continúan evolucionando.</p>
            <p>Recuerde que la selección de variedades es sólo una parte de un enfoque integral del cultivo del café. La mejor variedad seguirá necesitando prácticas de gestión adecuadas para alcanzar su máximo potencial.</p>

</script>
